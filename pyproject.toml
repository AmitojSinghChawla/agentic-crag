[project]
name = "agentic-crag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amitoj Singh Chawla", email = "amitojsinghkhalsa15@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "azure-core==1.35.1",
    "azure-search-documents==11.5.3",
    "dotenv>=0.9.9",
    "fastapi==0.136.3",
    "jinja2==3.1.6",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "openai>=3.29.0",
    "psycopg2-binary==2.9.10",
    "pydantic==2.11.7",
    "pymupdf4llm==1.27.2.3",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.32",
    "requests>=2.34.2",
    "sqlalchemy==2.0.50",
    "uvicorn==0.35.0",
]

[project.scripts]
