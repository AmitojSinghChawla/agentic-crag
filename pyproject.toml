[project]
name = "agentic-crag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amitoj Singh Chawla", email = "amitojsinghkhalsa15@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.143.0",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
]

[project.scripts]
agentic-crag = "agentic_crag:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
